name: SwiftDictionary 2.6.0 ACL drift regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/update_2_6_0_*.sql"
      - ".github/workflows/update-2-6-0-acl-test.yml"
  push:
    branches:
      - feature/update-2-6-0-legal-privacy-security
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/update_2_6_0_*.sql"
      - ".github/workflows/update-2-6-0-acl-test.yml"

permissions:
  contents: read

jobs:
  acl-regression:
    name: PostgreSQL 17 ACL migration regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Start disposable local Supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy
      - name: Apply all repository migrations to disposable local database
        run: supabase db reset
      - name: Run Update 2.6.0 least-privilege assertions
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/update_2_6_0_least_privilege.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/update_2_6_0_staging_acl_followup.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/update_2_6_0_acl_drift_correction.sql
      - name: Run local Supabase security advisor
        run: supabase db advisors --type security --fail-on error
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
