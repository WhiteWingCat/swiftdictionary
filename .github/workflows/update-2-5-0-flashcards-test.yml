name: SwiftDictionary Update 2.5.0 Flashcards checks

on:
  push:
    branches:
      - feature/update-2-5-0-flashcards
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flashcards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check mock-testing.js
          node --check flashcards.js
      - name: Check Flashcards page integration and inline application syntax
        run: node tests/update-2-5-0/check-flashcards-page.mjs
      - name: Run mock account, allowance, collection and timer regression tests
        run: node --test tests/update-2-3-1/mock-testing.test.mjs

  browser-mock:
    name: Chromium Mock User Flashcards browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run Mock User Flashcards browser tests
        env:
          CI: "true"
        run: npx playwright test tests/browser/update-2-5-0-flashcards.spec.js --config=playwright.config.js
