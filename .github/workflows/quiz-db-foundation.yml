name: Quiz database foundation

on:
  push:
    branches:
      - feature/update-2-4-0-quiz
      - feature/update-2-4-2-dashboard-quiz-fixes
      - feature/update-2-5-0-flashcards
      - feature/update-2-6-0-legal-privacy-security
      - feature/update-2-7-0-chinese-dictionary-lessons
      - feature/update-2-8-0-chinese-quiz-flashcards
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-db-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quiz-local-supabase:
    name: Local Supabase Auth and RPC integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Set up Node.js for authenticated browser tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Create an isolated local Supabase workspace
        run: |
          mkdir -p "$RUNNER_TEMP/swiftdictionary-quiz-supabase"
          cd "$RUNNER_TEMP/swiftdictionary-quiz-supabase"
          supabase init

      - name: Start disposable local Supabase services
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy

      - name: Verify real Supabase Auth contract
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/tests/update-2-3-0/supabase-local-auth-contract.sql"

      - name: Create clean staging application baseline and CI-only legacy fixtures
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/staging/bootstrap.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/staging/verify-clean-bootstrap.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/tests/update-2-3-0/supabase-local-app-fixtures.sql"

      - name: Apply Update 2.3.x prerequisite migrations
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          # Create the private lesson-exemption helper before the 2.3.x
          # allowance migrations; those later migrations install the current
          # completion-ledger trigger implementation.
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/202611090001_swiftdictionary_personal_lesson_testing_allowlist.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114082303_swiftdictionary_update_2_3_0_saved_words_privilege_hardening.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114082311_swiftdictionary_update_2_3_0_learning_content_catalog.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114082324_swiftdictionary_update_2_3_0_completion_based_allowance.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114082328_swiftdictionary_update_2_3_0_daily_activity_sessions.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114082332_swiftdictionary_update_2_3_0_current_window_allowance_ledger.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114082335_swiftdictionary_update_2_3_0_learning_history_deletion.sql"

      - name: Apply Quiz question-bank and authenticated RPC migrations
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261117113854_swiftdictionary_update_2_4_0_quiz_question_bank_foundation.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261117113904_swiftdictionary_update_2_4_0_quiz_authenticated_rpcs.sql"
          # Apply the approved Quiz-only 1/3 allowance migration in timestamp order.
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261116043139_swiftdictionary_update_2_4_0_quiz_allowance_1_3.sql"

      - name: Apply account-scoped learning introduction preferences
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261117113907_swiftdictionary_update_2_4_0_learning_page_introduction_preferences.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/learning_page_introduction_preferences.sql"

      - name: Apply authenticated question-type extension
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261117113912_swiftdictionary_update_2_4_0_quiz_authenticated_question_types.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261117132100_swiftdictionary_update_2_4_1_quiz_translation_language_fix.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_translation_language_eligibility_fix.sql"

      - name: Apply Flashcards schema, review history and 60/120-second challenge migration
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261118090000_swiftdictionary_update_2_5_0_flashcards_foundation.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261118100415_flashcards_mixed_recall_and_review_history.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261118100736_flashcards_review_history_deletion.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261119094011_swiftdictionary_update_2_5_0_flashcards_60_120_second_challenges.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261119094122_swiftdictionary_update_2_5_0_new_beginner_lessons.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261119094253_swiftdictionary_update_2_5_0_learning_history_deletion_preserve_quiz.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261119094558_swiftdictionary_update_2_5_0_learning_history_deletion_review_items_fix.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261119095730_swiftdictionary_update_2_5_0_flashcard_review_session_index.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/flashcards_authenticated_rpcs.sql"

      - name: Apply Update 2.6.0 least-privilege hardening and verify privileges
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261119112433_swiftdictionary_2_6_0_least_privilege_defaults_and_daily_sessions.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/update_2_6_0_least_privilege.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261120023718_update_2_6_0_remove_residual_api_privileges.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/update_2_6_0_staging_acl_followup.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261121090000_update_2_6_0_acl_drift_correction.sql"

      - name: Apply U2.7.0 language-aware lesson schema and regression tests
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261121140000_swiftdictionary_update_2_7_0_language_aware_lessons.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261122143000_update_2_7_0_lesson_start_allowance.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/update_2_7_0_language_aware_lessons.sql"

      - name: Apply U2.8.0 Chinese review foundation and privacy regression tests
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123120000_swiftdictionary_update_2_8_0_chinese_review_foundation.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123121000_swiftdictionary_update_2_8_0_flashcard_language_and_snapshots.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123122000_swiftdictionary_update_2_8_0_chinese_quiz_runtime.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123123000_swiftdictionary_update_2_8_0_daily_practice_attempt_metrics.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123124000_swiftdictionary_update_2_8_0_quiz_source_composition_guard.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123125000_swiftdictionary_update_2_8_0_security_invoker_wrappers.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/update_2_8_0_chinese_review_foundation.sql"

      - name: Apply U2.8.0 supplemental Flashcard and Quiz quality migrations
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          # Keep the local integration schema aligned with staging. The review
          # alias migration is required by the browser response contract.
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123130000_swiftdictionary_update_2_8_0_flashcard_review_mode_alias.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123131000_swiftdictionary_update_2_8_0_chinese_quiz_content.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123132000_swiftdictionary_update_2_8_0_foreign_key_indexes.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123140000_swiftdictionary_update_2_8_0_quiz_start_allowance_and_chinese_question_quality.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123141000_swiftdictionary_update_2_8_0_chinese_quiz_revision_preservation.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123142000_swiftdictionary_update_2_8_0_final_chinese_quiz_prompt_cleanup.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123143000_swiftdictionary_update_2_8_0_chinese_quiz_translation_prompt_quality.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123144000_swiftdictionary_update_2_8_0_final_quiz_translation_prompt_revision.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123145000_swiftdictionary_update_2_8_0_learning_intro_rls_initplan_optimization.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123146000_swiftdictionary_update_2_8_0_chinese_quiz_distractor_quality.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123147000_swiftdictionary_update_2_8_0_chinese_greeting_distractors.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123148000_swiftdictionary_update_2_8_0_quiz_start_allowance_error_copy.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261123149000_swiftdictionary_update_2_8_0_chinese_quiz_pinyin_leak_scan_fix.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261124120000_swiftdictionary_update_2_8_0_flashcard_review_item_dismissal.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/flashcard_review_item_dismissal.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261124150000_swiftdictionary_update_2_8_0_flashcard_history_capacity.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261124160000_swiftdictionary_update_2_8_0_chinese_quiz_content_polish.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261124170000_swiftdictionary_update_2_8_0_quiz_active_option_pinyin_redaction.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261124180000_swiftdictionary_update_2_8_0_chinese_quiz_draft_pinyin_leak_sweep.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261124190000_swiftdictionary_update_2_8_0_chinese_quiz_source_sync.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/update_2_8_0_chinese_quiz_content_polish.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/flashcards_chinese_runtime_u2_8_0.sql"

      - name: Verify explicit grants for all staged public tables
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/staging/verify-migration-grants.sql"

      - name: Install test-only observers and run authenticated Quiz RPC integration tests
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_rpc_test_observers.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_authenticated_rpcs.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_chinese_runtime_u2_8_0.sql"

      - name: Validate and import draft Quiz content in local Supabase
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_draft_content_catalog.sql"
          node "$GITHUB_WORKSPACE/scripts/quiz/validate-question-bank.mjs"
          node "$GITHUB_WORKSPACE/scripts/quiz/validate-question-bank.mjs" --emit-sql > "$RUNNER_TEMP/quiz-drafts.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/quiz-drafts.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_draft_content_import_assertions.sql"

      - name: Validate owner-authorized 199-question release export and migration
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          node "$GITHUB_WORKSPACE/scripts/quiz/validate-question-bank.mjs" --emit-sql --approve-for-release > "$RUNNER_TEMP/quiz-approved-export.sql"
          grep -q "OWNER-AUTHORIZED RELEASE IMPORT" "$RUNNER_TEMP/quiz-approved-export.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "delete from private.quiz_question_bank where question_id like 'quiz-%'"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/quiz-approved-export.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_release_content_import_assertions.sql"
          # The legacy import guard intentionally requires a completely empty bank,
          # including the 145-row Chinese U2.8.0 fixture imported earlier in this job.
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "delete from private.quiz_question_bank"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261117113917_swiftdictionary_update_2_4_0_quiz_content_release.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_release_content_import_assertions.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "delete from private.quiz_question_bank"

      - name: Seed disposable synthetic approved Quiz content
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/tests/quiz/quiz-browser-runtime-fixture.sql"

      - name: Run authenticated Chromium Quiz runtime tests against local Supabase
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          npm --prefix "$GITHUB_WORKSPACE" install --no-save @playwright/test
          "$GITHUB_WORKSPACE/node_modules/.bin/playwright" install --with-deps chromium
          eval "$(supabase status --output env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          cd "$GITHUB_WORKSPACE"
          CI=true npx playwright test tests/browser/update-2-4-0-quiz-runtime.spec.js --config=playwright.config.js
      - name: Run signed-out Flashcards and Preferences browser regressions
        run: npx playwright test tests/browser/update-2-5-0-flashcards.spec.js --config=playwright.config.js --workers=1 --retries=0 --grep "signing out restores|Preferences deletion controls|Flashcards shows a five-second toast|weak-memory items can be dismissed individually|Recent games paginate ten at a time|Quiz history paginates ten sessions|Chinese Sentence Recall blanks every repeated character and keeps choices hidden"
      - name: Run permanent Lessons allowance notification regression
        run: npx playwright test tests/browser/update-2-3-0-smoke.spec.js --config=playwright.config.js --workers=1 --retries=0 --grep "permanent Lessons allowance exhaustion shows a notification|signed-in Daily Topic completes|Daily Learning resets completed content and allowance automatically at local midnight"

      - name: Run Supabase security advisors against the local Quiz schema
        working-directory: ${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: supabase db advisors --type security --fail-on error

      - name: Stop disposable local Supabase services
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/swiftdictionary-quiz-supabase" ]; then
            cd "$RUNNER_TEMP/swiftdictionary-quiz-supabase"
            supabase stop --no-backup
          fi

  quiz-db-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftdictionary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swiftdictionary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: swiftdictionary_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate application JavaScript and Quiz frontend integration
        run: |
          node --check flashcards.js
          node --check daily-learning.js
          node --check permanent-lesson-confirmation.js
          node --check mock-testing.js
          node scripts/quiz/validate-quiz-frontend.mjs
          node tests/update-2-5-0/check-flashcards-page.mjs

      - name: Validate Chinese Quiz and Flashcard draft banks
        run: |
          node scripts/quiz/validate-chinese-question-bank.mjs
          node scripts/flashcards/validate-chinese-card-bank.mjs

      - name: Prepare disposable Supabase-compatible Auth and learning schema
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_rpc_bootstrap.sql

      - name: Apply account-scoped learning introduction preferences
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117113907_swiftdictionary_update_2_4_0_learning_page_introduction_preferences.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/learning_page_introduction_preferences.sql

      - name: Apply Quiz question-bank foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117113854_swiftdictionary_update_2_4_0_quiz_question_bank_foundation.sql

      - name: Validate Quiz question-bank foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_question_bank_foundation.sql

      - name: Apply authenticated Quiz RPC migration
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117113904_swiftdictionary_update_2_4_0_quiz_authenticated_rpcs.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117113912_swiftdictionary_update_2_4_0_quiz_authenticated_question_types.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117132100_swiftdictionary_update_2_4_1_quiz_translation_language_fix.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_translation_language_eligibility_fix.sql
          # The focused PostgreSQL fixture models the pre-U2.8.0 table shape;
          # add the pinyin field consumed by the shared start-allowance migration.
          psql -v ON_ERROR_STOP=1 -c "alter table private.quiz_question_bank add column if not exists prompt_pinyin text"
          # Quiz allowance is charged on successful session creation in U2.8.0.
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261123140000_swiftdictionary_update_2_8_0_quiz_start_allowance_and_chinese_question_quality.sql

      - name: Validate and import draft Quiz content in PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_draft_content_catalog.sql
          node scripts/quiz/validate-question-bank.mjs
          node scripts/quiz/validate-question-bank.mjs --emit-sql > "$RUNNER_TEMP/quiz-drafts.sql"
          psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/quiz-drafts.sql"
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_draft_content_import_assertions.sql

      - name: Validate authenticated Quiz RPCs, session lifecycle and allowances
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_authenticated_rpcs.sql
