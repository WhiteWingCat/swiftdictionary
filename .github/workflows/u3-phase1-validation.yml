name: SwiftDictionary U3.0 Phase 1 architecture regression

on:
  push:
    branches:
      - feature/update-3.0-phase-0-audit
    paths:
      - "index.html"
      - "js/**"
      - "data/**"
      - "content/**"
      - "scripts/content/**"
      - "tests/*.test.cjs"
      - "tests/*.test.mjs"
      - ".github/workflows/u3-phase1-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "js/**"
      - "data/**"
      - "content/**"
      - "scripts/content/**"
      - "tests/*.test.cjs"
      - "tests/*.test.mjs"
      - ".github/workflows/u3-phase1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u3-phase1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-content-regression:
    name: Architecture, adapter, translation and content parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check U3.0 runtime module syntax
        run: |
          node --check js/core/language-registry.js
          node --check js/core/content-contracts.js
          node --check js/core/content-packages.js
          node --check js/core/legacy-content-bootstrap.js
          node --check js/core/translation-registry.js
          node --check js/core/dictionary-translation-overlay.js
          node --check scripts/content/export-malay-translation-input.cjs
          node --check scripts/content/validate-malay-dictionary-translations.cjs
          bash tests/cloudflare-build-routing.sh
          node --check js/languages/adapters.js
          node --check data/languages/malay-dictionary.js
          node --check data/malay-lessons.js
          node --check data/malay-lessons-expansion-02.js
          node --check data/malay-lessons-expansion-03.js
          node --check data/malay-lessons-expansion-04.js
          node --check data/malay-lessons-expansion-05.js
          node --check data/malay-daily-learning.js
          node --check daily-learning.js
          node --check scripts/content/validation-core.mjs
      - name: Run all architecture and content regression tests
        run: node --test --test-concurrency=1 tests/*.test.cjs tests/*.test.mjs
