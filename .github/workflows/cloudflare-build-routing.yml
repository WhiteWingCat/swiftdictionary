name: Cloudflare build routing guard

on:
  push:
    branches:
      - feature/update-2-6-0-legal-privacy-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloudflare-build-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify environment routing safeguards
        run: bash tests/cloudflare-build-routing.sh
